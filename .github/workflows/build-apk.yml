name: Build Android APK

on:
  push:
    branches:
      - claude/*
      - main
      - master
    paths:
      - 'app1/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('app1/buildozer.spec') }}

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: app1/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('app1/buildozer.spec') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk pkg-config \
            zlib1g-dev libncurses5-dev libffi-dev libssl-dev build-essential \
            python3-dev libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev \
            libsdl2-ttf-dev autoconf automake libtool

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==3.0.11

      - name: Build APK
        working-directory: app1
        run: |
          yes | buildozer -v android debug
        timeout-minutes: 60

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTRLI-Superbot-APK
          path: app1/bin/*.apk

      - name: Create Release
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.12-${{ github.run_number }}
          name: NTRLI Superbot v1.0.12-${{ github.run_number }}
          body: |
            # NTRLI Superbot Android App

            **Version:** 1.0.12
            **Build:** ${{ github.run_number }}
            **Commit:** ${{ github.sha }}

            ## Features
            - NTRLI' AI with multi-provider support
            - Pre-prompt AI ranking algorithm
            - Admin/User API separation
            - Lazy imports for Android stability

            ## Download
            Download the APK file below and install on your Android device.
          files: app1/bin/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Summary
        run: |
          echo "### Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "APK files:" >> $GITHUB_STEP_SUMMARY
          ls -lh app1/bin/*.apk >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No APK files found" >> $GITHUB_STEP_SUMMARY
