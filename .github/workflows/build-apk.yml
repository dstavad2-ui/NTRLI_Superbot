name: Build Android APK

on:
  push:
    branches:
      - claude/create-app1-folder-sbGsL
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build with Buildozer (Official Action)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          workdir: app1
          buildozer_version: stable

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTRLI-Superbot-APK
          path: ${{ steps.buildozer.outputs.filename }}

      - name: Create Release
        if: github.ref == 'refs/heads/claude/create-app1-folder-sbGsL' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NTRLI Superbot v1.0.${{ github.run_number }}
          body: |
            # 📱 NTRLI Superbot Android App

            ## ✅ Download & Install

            1. Download the APK below
            2. Enable "Install from Unknown Sources"
            3. Install and launch!

            ## 🎯 Features

            - ✅ Telegram Authentication (@Sir_NTRLI_II admin)
            - ✅ Tor/VPN Privacy
            - ✅ Anonymous & Standard Modes
            - ✅ AI System (Claude + GPT-4)
            - ✅ E-commerce (400 NOK minimum)
            - ✅ Business News Feed
            - ✅ 20+ Languages
            - ✅ Web Admin Panel

            ## 📋 Requirements

            - Android 7.0+ (API 24+)
            - Internet connection
            - Telegram account

            ---
            Built with GitHub Actions
            Commit: ${{ github.sha }}
          files: ${{ steps.buildozer.outputs.filename }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Complete
        run: |
          echo "✅ APK built successfully!"
          echo "📦 File: ${{ steps.buildozer.outputs.filename }}"
          echo "📥 Download from Actions → Artifacts or Releases page"
