name: Build Android APK

on:
  push:
    branches:
      - claude/create-app1-folder-sbGsL
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cache Buildozer global directory
        uses: actions/cache@v4
        with:
          path: .buildozer_global
          key: buildozer-global-${{ hashFiles('app1/buildozer.spec') }}

      - name: Cache Buildozer directory
        uses: actions/cache@v4
        with:
          path: app1/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('app1/buildozer.spec') }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake \
            libffi-dev libssl-dev build-essential ccache python3-dev \
            libsqlite3-dev libreadline-dev libbz2-dev libgdbm-dev \
            libsqlite3-dev tk-dev lzma-dev liblzma-dev libsdl2-dev \
            libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev

      - name: Install Buildozer and Cython
        run: |
          python -m pip install --upgrade pip
          pip install buildozer cython==3.0.11

      - name: Build APK with Buildozer
        working-directory: app1
        run: |
          yes | buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NTRLI-Superbot-APK
          path: app1/bin/*.apk

      - name: Create Release
        if: github.ref == 'refs/heads/claude/create-app1-folder-sbGsL' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: NTRLI Superbot v1.0.${{ github.run_number }}
          body: |
            # 📱 NTRLI Superbot Android App

            ## ✅ Download & Install

            1. Download the APK below
            2. Enable "Install from Unknown Sources"
            3. Install and launch!

            ## 🎯 Features

            - ✅ Telegram Authentication (@Sir_NTRLI_II admin)
            - ✅ Tor/VPN Privacy
            - ✅ Anonymous & Standard Modes
            - ✅ AI System (Claude + GPT-4)
            - ✅ E-commerce (400 NOK minimum)
            - ✅ Business News Feed
            - ✅ 20+ Languages
            - ✅ Web Admin Panel

            ## 📋 Requirements

            - Android 7.0+ (API 21+)
            - Internet connection
            - Telegram account

            ---
            Built with GitHub Actions
            Commit: ${{ github.sha }}
          files: app1/bin/*.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Complete
        run: |
          echo "✅ APK built successfully!"
          ls -lh app1/bin/
